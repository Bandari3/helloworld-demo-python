name: Docker CI pipeline
run-name: ${{github.actor}} is running out Docker CI pipeline
on: [push]
jobs:
  docker-build-push:
    runs-on: ubuntu-latest
    steps:
      - name: clone the code
        uses: actions/checkout@v6
      - name: Lint Dockerfile with Hadolint
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile
          config: .hadolint.yaml
      - name: Docker Build
        run: docker build -t ${{vars.DOCKERHUB_USERNAME}}/helloworld-python:v1 .
        
      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Docker push
        run: docker push ${{vars.DOCKERHUB_USERNAME}}/helloworld-python:v1

      - name: Docker run 
        run: docker run --name helloworld-python -itd -p 8080:8080 ${{vars.DOCKERHUB_USERNAME}}/helloworld-python:v1

      - name: view the container
        run: docker ps
